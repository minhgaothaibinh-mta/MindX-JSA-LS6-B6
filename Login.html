<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #e8f4ff, #f5f7fb);
      color: #1f2937;
    }
    .login-card {
      width: 100%;
      max-width: 410px;
      padding: 34px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 16px 45px rgba(15, 23, 42, 0.12);
    }
    .logo {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 16px;
      background: #e0f2fe;
      color: #0369a1;
      font-size: 27px;
      font-weight: 700;
    }
    h1 { margin: 0; text-align: center; font-size: 26px; }
    .subtitle {
      margin: 10px 0 28px;
      color: #64748b;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }
    .field { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, .13);
    }
    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 2px 0 22px;
      font-size: 13px;
    }
    .remember { display: flex; align-items: center; gap: 7px; color: #475569; }
    .remember input { width: auto; margin: 0; }
    a { color: #0369a1; text-decoration: none; }
    a:hover { text-decoration: underline; }
    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #0369a1;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, transform .1s;
    }
    button:hover { background: #075985; }
    button:active { transform: scale(.99); }
    .message { display: none; margin-top: 16px; font-size: 14px; text-align: center; }
    .footer { margin-top: 25px; color: #94a3b8; text-align: center; font-size: 12px; }
    @media (max-width: 480px) {
      .login-card { padding: 26px 22px; }
      .options { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="logo" aria-hidden="true">ĐN</div>
    <h1>Đăng nhập</h1>
    <p class="subtitle">Vui lòng nhập thông tin tài khoản để tiếp tục.</p>

    <form id="loginForm">
      <div class="field">
        <label for="username">Tên đăng nhập hoặc email</label>
        <input id="username" name="username" type="text"
               placeholder="Nhập tên đăng nhập hoặc email"
               autocomplete="username" required>
      </div>

      <div class="field">
        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password"
               placeholder="Nhập mật khẩu"
               autocomplete="current-password" required>
      </div>

      <div class="options">
        <label class="remember" for="remember">
          <input id="remember" name="remember" type="checkbox">
          Ghi nhớ đăng nhập
        </label>
        <a href="#" id="forgotLink">Quên mật khẩu?</a>
      </div>

      <button type="submit">Đăng nhập</button>
      <p class="message" id="message" role="status"></p>
    </form>

    <div class="footer">© 2026 · Hệ thống quản lý</div>
  </main>

  <script>
    // Giao diện mẫu: chưa kết nối API xác thực.
    document.getElementById('loginForm').addEventListener('submit', function (event) {
      event.preventDefault();
      const message = document.getElementById('message');
      message.style.display = 'block';
      message.style.color = '#b45309';
      message.textContent = 'Đây là giao diện mẫu. Cần kết nối API đăng nhập để xác thực tài khoản.';
    });

    document.getElementById('forgotLink').addEventListener('click', function (event) {
      event.preventDefault();
      const message = document.getElementById('message');
      message.style.display = 'block';
      message.style.color = '#475569';
      message.textContent = 'Vui lòng liên hệ quản trị viên để được hỗ trợ đặt lại mật khẩu.';
    });
  </script>
</body>
</html>
